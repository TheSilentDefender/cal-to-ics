[package]
name = "events-to-subcal-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
poise = "0.6"
serenity = "0.12"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rand = "0.8"
dotenvy = "0.15"
icalendar = "0.17.17"
futures = "0.3.34"
tracing = "0.1.44"

[dev-dependencies]
cargo-watch = "8.5.3"
